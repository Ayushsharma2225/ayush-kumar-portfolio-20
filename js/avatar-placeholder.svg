<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular background with subtle tech grid -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#glowRing)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Tech matrix / constellation dots -->
  <g opacity="0.4">
    <circle cx="90" cy="110" r="3" fill="#38bdf8"/>
    <circle cx="310" cy="120" r="3" fill="#c084fc"/>
    <circle cx="80" cy="280" r="2.5" fill="#818cf8"/>
    <circle cx="320" cy="270" r="3" fill="#38bdf8"/>
    <circle cx="150" cy="70" r="2" fill="#e2e8f0"/>
    <circle cx="250" cy="65" r="2" fill="#e2e8f0"/>
    <line x1="90" y1="110" x2="150" y2="70" stroke="#38bdf8" stroke-width="0.8" opacity="0.3"/>
    <line x1="310" y1="120" x2="250" y2="65" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Developer Silhouette / Modern Avatar -->
  <!-- Body/Shoulders -->
  <path d="M120 330 C120 270, 160 250, 200 250 C240 250, 280 270, 280 330 C280 345, 270 355, 255 355 L145 355 C130 355, 120 345, 120 330 Z" 
        fill="url(#avatarGrad)" opacity="0.85"/>
  
  <!-- Hoodie / Collar accent -->
  <path d="M165 258 L200 295 L235 258 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Neck -->
  <rect x="186" y="215" width="28" height="42" rx="6" fill="#fbcfe8" opacity="0.9"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="46" ry="54" fill="#fed7aa"/>

  <!-- Hair (modern styled haircut) -->
  <path d="M152 170 C150 120, 180 115, 205 115 C235 115, 250 130, 248 170 C240 150, 230 140, 200 140 C175 140, 160 152, 152 170 Z" fill="#1e293b"/>
  <path d="M150 170 C155 140, 185 125, 220 125 C240 125, 248 135, 250 155 C242 142, 225 135, 205 136 C180 138, 165 150, 150 170 Z" fill="#0f172a"/>

  <!-- Smart Glasses (modern developer aesthetic) -->
  <rect x="165" y="166" width="30" height="20" rx="6" fill="none" stroke="#0284c7" stroke-width="3"/>
  <rect x="205" y="166" width="30" height="20" rx="6" fill="none" stroke="#0284c7" stroke-width="3"/>
  <line x1="195" y1="174" x2="205" y2="174" stroke="#0284c7" stroke-width="3"/>
  <line x1="155" y1="174" x2="165" y2="174" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="235" y1="174" x2="245" y2="174" stroke="#0284c7" stroke-width="2.5"/>
  
  <!-- Lens reflection -->
  <line x1="168" y1="170" x2="176" y2="182" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="208" y1="170" x2="216" y2="182" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Smile / Expression -->
  <path d="M190 206 Q200 214 210 206" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Modern Tech Badges floating around -->
  <!-- AI / Brain Spark Badge -->
  <g transform="translate(65, 175)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="20" y="26" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- AI / ML Spark Badge -->
  <g transform="translate(295, 175)" filter="url(#softGlow)">
    <circle cx="20" cy="20" r="20" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="20" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c084fc" text-anchor="middle">AI</text>
  </g>
</svg>
