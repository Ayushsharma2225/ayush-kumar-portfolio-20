<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Code brackets and neural node -->
  <path d="M22 22 L14 32 L22 42" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M42 22 L50 32 L42 42" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- Neural connection sparks -->
  <line x1="24" y1="26" x2="30" y2="30" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="40" y1="38" x2="34" y2="34" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
